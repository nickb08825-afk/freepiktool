[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "freepiktool"
version = "1.0.0"
description = "Download Freepik assets (JPEG/PNG/SVG/EPS/high-res, basic + premium + AI) faster and more efficiently."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "aiohttp>=3.9.0",
    "aiofiles>=23.2.1",
    "tqdm>=4.66.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.1.0",
]

[project.scripts]
freepiktool = "freepiktool.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "responses>=0.25",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["freepiktool*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
